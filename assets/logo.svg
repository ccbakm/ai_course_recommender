<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Purple (bottom) → Cyan (top) gradient matching brand -->
    <linearGradient id="bolt" x1="40%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%"   stop-color="#7c4dff"/>
      <stop offset="55%"  stop-color="#7b9fff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Same gradient for nodes -->
    <linearGradient id="node-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>

    <!-- Soft glow behind the bolt -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tighter glow for small nodes -->
    <filter id="node-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Lightning bolt (right-leaning parallelogram pair) ── -->
  <!--
    Upper blade: (35,8)→(62,8) top, lean right to (72,52)→(46,52) bottom
    Lower blade: (28,52)→(54,52) top, lean right to (42,92)→(70,92) bottom
  -->
  <polygon
    points="35,8 62,8 72,52 54,52 70,92 42,92 28,52 46,52"
    fill="url(#bolt)"
    filter="url(#glow)"
  />

  <!-- ── Circuit traces at the notch (dashed) ── -->
  <line x1="28" y1="52" x2="46" y2="52"
        stroke="rgba(255,255,255,0.35)" stroke-width="1.2"
        stroke-dasharray="3,2.5" stroke-linecap="round"/>
  <line x1="54" y1="52" x2="72" y2="52"
        stroke="rgba(255,255,255,0.35)" stroke-width="1.2"
        stroke-dasharray="3,2.5" stroke-linecap="round"/>

  <!-- ── Neural nodes at every vertex (filled + white core) ── -->
  <!-- Top-left -->
  <circle cx="35" cy="8"  r="5.5" fill="#00e5ff" filter="url(#node-glow)"/>
  <circle cx="35" cy="8"  r="2.2" fill="white"/>

  <!-- Top-right -->
  <circle cx="62" cy="8"  r="5.5" fill="#00e5ff" filter="url(#node-glow)"/>
  <circle cx="62" cy="8"  r="2.2" fill="white"/>

  <!-- Notch outer-left (widest span at mid-height) -->
  <circle cx="28" cy="52" r="4.5" fill="#a78bfa" filter="url(#node-glow)"/>
  <circle cx="28" cy="52" r="1.8" fill="white"/>

  <!-- Notch inner-left -->
  <circle cx="46" cy="52" r="4"   fill="#a78bfa" filter="url(#node-glow)"/>
  <circle cx="46" cy="52" r="1.6" fill="white"/>

  <!-- Notch inner-right -->
  <circle cx="54" cy="52" r="4"   fill="#a78bfa" filter="url(#node-glow)"/>
  <circle cx="54" cy="52" r="1.6" fill="white"/>

  <!-- Notch outer-right -->
  <circle cx="72" cy="52" r="4.5" fill="#38b2ff" filter="url(#node-glow)"/>
  <circle cx="72" cy="52" r="1.8" fill="white"/>

  <!-- Bottom-left -->
  <circle cx="42" cy="92" r="5.5" fill="#7c4dff" filter="url(#node-glow)"/>
  <circle cx="42" cy="92" r="2.2" fill="white"/>

  <!-- Bottom-right -->
  <circle cx="70" cy="92" r="5.5" fill="#7c4dff" filter="url(#node-glow)"/>
  <circle cx="70" cy="92" r="2.2" fill="white"/>
</svg>
